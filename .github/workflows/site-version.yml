name: Generate site build version

on:
  push:
    branches:
      - main
    paths-ignore:
      - audio-build.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate deployment version
        shell: bash
        run: |
          cat > audio-build.json <<EOF
          {
            "version": "v${GITHUB_RUN_NUMBER}",
            "run": ${GITHUB_RUN_NUMBER},
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit generated version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-build.json
          if git diff --cached --quiet; then
            echo "Build version is already current."
            exit 0
          fi
          git commit -m "Update generated site build version"
          git push
