name: Generate site build version

on:
  push:
    branches:
      - main
    paths-ignore:
      - audio-build.json
  workflow_dispatch:

# Serialize version commits so two pushes cannot race each other.
concurrency:
  group: site-build-version
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate deployment version
        shell: bash
        run: |
          cat > audio-build.json <<EOF
          {
            "version": "v${GITHUB_RUN_NUMBER}",
            "run": ${GITHUB_RUN_NUMBER},
            "deployedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Commit generated version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio-build.json
          if git diff --cached --quiet; then
            echo "Generated version is already current."
            exit 0
          fi
          git commit -m "Update generated site build version"
          # Retry safely if another main-branch commit lands during this job.
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying after refreshing main."
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Could not push generated version after three attempts."
          exit 1
