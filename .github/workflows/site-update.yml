name: Site update status

on:
  push:
    branches: [main]
    paths-ignore:
      - "travel/last-updated.json"
      - "travel/version.json"
      - ".github/workflows/site-live-notify.yml"
  workflow_dispatch:

permissions:
  contents: write

# The live-notification workflow waits for the matching Pages run after this workflow pushes.
# Keep only the newest pending update; don't queue obsolete deployments.
concurrency:
  group: site-update-status
  cancel-in-progress: true

jobs:
  validate-and-stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate gallery JavaScript
        run: node --check travel/photos.js

      - name: Increment photo gallery version
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "travel/version.json";
          const data = JSON.parse(fs.readFileSync(path, "utf8"));
          const parts = String(data.version || "").split(".").map(Number);
          if (parts.length !== 3 || parts.some(value => !Number.isInteger(value) || value < 0)) {
            throw new Error("Invalid photo gallery version in " + path);
          }
          parts[2] += 1;
          data.version = parts.join(".");
          fs.writeFileSync(path, JSON.stringify(data, null, 2) + "\n");
          console.log("Photo gallery version: " + data.version);
          NODE

      - name: Write last-updated timestamp
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("travel/last-updated.json", JSON.stringify({updatedAt:new Date().toISOString(), sourceCommit:process.env.SOURCE_SHA}, null, 2)+"\n")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel/last-updated.json travel/version.json
          git commit -m "Update site timestamp [skip ci]" || exit 0
          git push origin HEAD:main
