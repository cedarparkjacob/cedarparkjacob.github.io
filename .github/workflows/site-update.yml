name: Site update status

on:
  push:
    branches: [main]
    paths-ignore:
      - "travel/last-updated.json"
  workflow_dispatch:

permissions:
  contents: write

# Keep only the newest pending update; don't queue obsolete deployments.
concurrency:
  group: site-update-status
  cancel-in-progress: true

jobs:
  validate-and-stamp:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate gallery JavaScript
        run: node --check travel/photos.js

      - name: Write last-updated timestamp
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          node -e 'const fs=require("fs"); fs.writeFileSync("travel/last-updated.json", JSON.stringify({updatedAt:new Date().toISOString(), sourceCommit:process.env.SOURCE_SHA}, null, 2)+"\n")'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add travel/last-updated.json
          git commit -m "Update site timestamp [skip ci]" || exit 0
          git push origin HEAD:main
