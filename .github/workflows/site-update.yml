name: Generate site metadata

on:
  push:
    branches:
      - main
    paths-ignore:
      - "version.json"
      - "audio-build.json"
      - "audio-debug-build.json"
      - "travel/last-updated.json"
      - "travel/version.json"
  workflow_dispatch:

permissions:
  contents: write

# One workflow owns all generated metadata, avoiding competing metadata pushes.
concurrency:
  group: site-generated-metadata
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate application JavaScript
        run: |
          node --check travel/photos.js
          node --check assets/drive.js

      - name: Generate and publish all site metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild from the newest main on every retry. This avoids stale
          # commits and avoids rebase conflicts with simultaneous site pushes.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node <<'NODE'
          const { execFileSync } = require("child_process");
          const fs = require("fs");
          const now = new Date().toISOString();
          const before = process.env.SOURCE_BEFORE || "";
          const source = process.env.SOURCE_SHA || "";
          let changed = [];
          if (/^[0-9a-f]{40}$/.test(before) && /^[0-9a-f]{40}$/.test(source)) {
            changed = execFileSync("git", ["diff", "--name-only", before, source], { encoding: "utf8" })
              .split("\n").filter(Boolean);
          } else {
            // Manual workflow dispatch: refresh both app versions.
            changed = ["travel/photos.js", "audio.html", "audio-debug.html"];
          }

          const sharedChanged = changed.some(p =>
            ["assets/drive.js", "assets/site.css", "assets/site.js"].includes(p)
          );
          const photosChanged = sharedChanged || changed.some(p => p.startsWith("travel/"));
          const audioChanged = sharedChanged || changed.some(p =>
            p === "audio.html" || p.startsWith("audio/")
          );
          const audioDebugChanged = changed.includes("audio-debug.html");

          if (photosChanged) {
            const versionPath = "travel/version.json";
            const versionData = JSON.parse(fs.readFileSync(versionPath, "utf8"));
            const parts = String(versionData.version || "").split(".").map(Number);
            if (parts.length !== 3 || parts.some(n => !Number.isInteger(n) || n < 0)) {
              throw new Error("Invalid photo gallery version in " + versionPath);
            }
            parts[2] += 1;
            versionData.version = parts.join(".");
            fs.writeFileSync(versionPath, JSON.stringify(versionData, null, 2) + "\n");
            console.log("Generated photo version " + versionData.version);
          }

          if (audioChanged) {
            const audioPath = "audio-build.json";
            const audioData = JSON.parse(fs.readFileSync(audioPath, "utf8"));
            const audioMatch = String(audioData.version || "").match(/^v(\d+)$/);
            if (!audioMatch) throw new Error("Invalid independent audio version in " + audioPath);
            const audioVersion = Number(audioMatch[1]) + 1;
            fs.writeFileSync(audioPath, JSON.stringify({
              version: "v" + audioVersion,
              run: audioVersion,
              deployedAt: now,
              sourceCommit: source
            }, null, 2) + "\n");
            console.log("Generated independent audio version v" + audioVersion);
          }

          if (audioDebugChanged) {
            const debugPath = "audio-debug-build.json";
            const debugData = JSON.parse(fs.readFileSync(debugPath, "utf8"));
            const debugMatch = String(debugData.version || "").match(/^v(\d+)$/);
            if (!debugMatch) throw new Error("Invalid independent audio debug version in " + debugPath);
            const debugVersion = Number(debugMatch[1]) + 1;
            fs.writeFileSync(debugPath, JSON.stringify({
              version: "v" + debugVersion,
              run: debugVersion,
              deployedAt: now,
              sourceCommit: source
            }, null, 2) + "\n");
            console.log("Generated audio debug version v" + debugVersion);
          }

          const rootVersionPath = "version.json";
          const rootVersionData = JSON.parse(fs.readFileSync(rootVersionPath, "utf8"));
          const rootVersionMatch = String(rootVersionData.version || "").match(/^v?(\\d+)$/);
          if (!rootVersionMatch) throw new Error("Invalid site version in " + rootVersionPath);
          const nextRootVersion = Number(rootVersionMatch[1]) + 1;
          fs.writeFileSync(rootVersionPath, JSON.stringify({
            version: "v" + nextRootVersion,
            commit: source.slice(0, 7),
            updated: now
          }, null, 2) + "\\n");
          console.log("Generated site version v" + nextRootVersion);

          fs.writeFileSync("travel/last-updated.json", JSON.stringify({
            updatedAt: now,
            sourceCommit: source
          }, null, 2) + "\n");
          console.log("Changed files:", changed.join(", ") || "(none)");
          NODE

            git add version.json audio-build.json audio-debug-build.json travel/last-updated.json travel/version.json
            git commit -m "Update site timestamp [skip ci]"

            if git push origin HEAD:main; then
              echo "All site metadata published successfully."
              exit 0
            fi

            echo "Push attempt $attempt lost a race with another main-branch update."
            sleep "$attempt"
          done

          echo "Unable to publish metadata after five attempts."
          exit 1
