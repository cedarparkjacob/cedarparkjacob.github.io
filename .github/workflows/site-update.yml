name: Generate site metadata

on:
  push:
    branches:
      - main
    paths-ignore:
      - "audio-build.json"
      - "travel/last-updated.json"
      - "travel/version.json"
      - ".github/workflows/site-live-notify.yml"
  workflow_dispatch:

permissions:
  contents: write

# One workflow owns all generated metadata, avoiding competing metadata pushes.
concurrency:
  group: site-generated-metadata
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate application JavaScript
        run: |
          node --check travel/photos.js
          node --check assets/drive.js

      - name: Generate and publish all site metadata
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Rebuild from the newest main on every retry. This avoids stale
          # commits and avoids rebase conflicts with simultaneous site pushes.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            node <<'NODE'
          const fs = require("fs");

          const versionPath = "travel/version.json";
          const versionData = JSON.parse(fs.readFileSync(versionPath, "utf8"));
          const parts = String(versionData.version || "").split(".").map(Number);
          if (parts.length !== 3 || parts.some(n => !Number.isInteger(n) || n < 0)) {
            throw new Error("Invalid photo gallery version in " + versionPath);
          }
          parts[2] += 1;
          versionData.version = parts.join(".");
          fs.writeFileSync(versionPath, JSON.stringify(versionData, null, 2) + "\n");

          const now = new Date().toISOString();
          fs.writeFileSync("travel/last-updated.json", JSON.stringify({
            updatedAt: now,
            sourceCommit: process.env.SOURCE_SHA
          }, null, 2) + "\n");

          const audioPath = "audio-build.json";
          const audioData = JSON.parse(fs.readFileSync(audioPath, "utf8"));
          const audioMatch = String(audioData.version || "").match(/^v(\\d+)$/);
          if (!audioMatch) throw new Error("Invalid independent audio version in " + audioPath);
          const audioVersion = Number(audioMatch[1]) + 1;
          fs.writeFileSync(audioPath, JSON.stringify({
            version: "v" + audioVersion,
            run: audioVersion,
            deployedAt: now,
            sourceCommit: process.env.SOURCE_SHA
          }, null, 2) + "\\n");

          console.log("Generated photo version " + versionData.version);
          console.log("Generated independent audio version v" + audioVersion);
          NODE

            git add audio-build.json travel/last-updated.json travel/version.json
            git commit -m "Update site timestamp [skip ci]"

            if git push origin HEAD:main; then
              echo "All site metadata published successfully."
              exit 0
            fi

            echo "Push attempt $attempt lost a race with another main-branch update."
            sleep "$attempt"
          done

          echo "Unable to publish metadata after five attempts."
          exit 1
