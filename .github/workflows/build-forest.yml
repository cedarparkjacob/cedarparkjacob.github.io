name: Build Forest Flight

on:
  push:
    paths:
      - "forest/source/**"
      - ".github/workflows/build-forest.yml"
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forest-flight-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest main branch before building
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install build dependencies
        run: npm install --prefix forest/source
      - name: Build standalone forest page
        run: npm run build --prefix forest/source
      - name: Commit generated page
        run: |
          if git diff --quiet -- forest/index.html; then
            echo "No generated page changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forest/index.html
          if git diff --cached --quiet; then
            echo "No generated page changes."
            exit 0
          fi
          git commit -m "Build Forest Flight page"
          # Other repository workflows may commit while this build is running.
          # Rebase the generated page commit onto the latest main before pushing.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying..."
            sleep 2
          done
          exit 1
