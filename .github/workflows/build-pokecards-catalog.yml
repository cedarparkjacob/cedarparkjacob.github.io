name: Build PokéCards catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "pokecards/scripts/build_catalog.py"
      - ".github/workflows/build-pokecards-catalog.yml"
  schedule:
    - cron: "31 7 * * 1"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build English and Japanese catalog
        run: python pokecards/scripts/build_catalog.py
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pokecards/data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog is already current."
          else
            git commit -m "Update PokéCards catalog"
            git push
          fi
