name: Notify when site is live

on:
  workflow_run:
    workflows: ["Site update status"]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the matching GitHub Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const maxAttempts = 40;
            let targetSha = null;
            let pagesRun = null;

            // The status workflow pushes a timestamp/version commit after
            // validation. Wait for Pages to publish that exact commit.
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              const { data: branch } = await github.rest.repos.getBranch({
                owner,
                repo,
                branch: "main"
              });

              const message = branch.commit.commit.message || "";
              if (message.includes("Update site timestamp")) {
                targetSha = branch.commit.sha;
                const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                  owner,
                  repo,
                  per_page: 100
                });
                pagesRun = data.workflow_runs.find(run =>
                  run.name === "pages build and deployment" &&
                  run.head_sha === targetSha
                );

                if (pagesRun && pagesRun.status === "completed") break;
              }

              core.info("Waiting for the matching Pages deployment (" + (attempt + 1) + "/" + maxAttempts + ").");
              await new Promise(resolve => setTimeout(resolve, 15000));
            }

            if (!pagesRun || pagesRun.status !== "completed" || pagesRun.conclusion !== "success") {
              core.warning("No successful Pages deployment was confirmed within the wait window. No notification was sent.");
              return;
            }

            // Do not notify for a deployment that became stale while it was running.
            const { data: latestBranch } = await github.rest.repos.getBranch({
              owner,
              repo,
              branch: "main"
            });
            if (latestBranch.commit.sha !== targetSha) {
              core.info("A newer commit reached main; skipping this outdated deployment notification.");
              return;
            }

            const title = "Site deployment notifications";
            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            let issue = openIssues.find(item =>
              !item.pull_request && item.title === title
            );

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: "This thread records successful GitHub Pages deployments. Each successful site update adds a comment and mentions @cedarparkjacob."
              });
              issue = created.data;
            }

            const body = [
              "@cedarparkjacob **Your site update is live.**",
              "",
              "- Site: https://ludden.uk/",
              "- Photo gallery: https://ludden.uk/travel/photos.html",
              "- Published commit: `" + targetSha.slice(0, 7) + "`",
              "- Deployment completed: " + new Date(pagesRun.updated_at).toUTCString(),
              "- [View successful Pages deployment](" + pagesRun.html_url + ")"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body
            });
