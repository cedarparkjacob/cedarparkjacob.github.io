name: Notify when site is live

on:
  workflow_run:
    workflows: ["Generate site metadata"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  confirm-live:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the matching GitHub Pages deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            // GitHub's API can briefly return 5xx responses. Retry those
            // instead of failing the whole notification job immediately.
            async function withRetry(label, operation, attempts = 6) {
              for (let attempt = 1; attempt <= attempts; attempt++) {
                try {
                  return await operation();
                } catch (error) {
                  const status = error.status || (error.response && error.response.status);
                  const retryable = status === 408 || status === 429 ||
                    status === 500 || status === 502 || status === 503 || status === 504;
                  if (!retryable || attempt === attempts) throw error;
                  const delay = Math.min(30000, 1500 * Math.pow(2, attempt - 1));
                  core.warning(label + " returned HTTP " + status +
                    "; retry " + attempt + "/" + (attempts - 1) +
                    " in " + delay + " ms.");
                  await sleep(delay);
                }
              }
            }

            const maxChecks = 40;
            let targetSha = null;
            let pagesRun = null;

            // The metadata workflow commits a timestamp/version marker after
            // validating changed JavaScript. Wait for Pages to publish that
            // exact commit before declaring the site live.
            for (let check = 1; check <= maxChecks; check++) {
              const { data: branch } = await withRetry("Get main branch", () =>
                github.rest.repos.getBranch({ owner, repo, branch: "main" })
              );

              const message = branch.commit.commit.message || "";
              if (message.includes("Update site timestamp")) {
                targetSha = branch.commit.sha;
                const { data } = await withRetry("List workflow runs", () =>
                  github.rest.actions.listWorkflowRunsForRepo({
                    owner, repo, per_page: 100
                  })
                );
                pagesRun = data.workflow_runs.find(run =>
                  run.name === "pages build and deployment" &&
                  run.head_sha === targetSha
                );

                if (pagesRun && pagesRun.status === "completed") break;
              }

              core.info("Waiting for the matching Pages deployment (" +
                check + "/" + maxChecks + ").");
              await sleep(15000);
            }

            if (!pagesRun || pagesRun.status !== "completed" ||
                pagesRun.conclusion !== "success") {
              core.setFailed("GitHub Pages did not confirm a successful deployment within the wait window.");
              return;
            }

            const { data: latestBranch } = await withRetry("Verify latest main commit", () =>
              github.rest.repos.getBranch({ owner, repo, branch: "main" })
            );
            if (latestBranch.commit.sha !== targetSha) {
              core.setFailed("A newer commit reached main before notification; this deployment is outdated.");
              return;
            }

            core.notice("Site is live: https://ludden.uk/");
            core.notice("Published commit: " + targetSha);
            core.notice("Pages deployment: " + pagesRun.html_url);
