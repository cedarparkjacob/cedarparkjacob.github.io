name: Notify when site is live

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  actions: read
  issues: write

jobs:
  notify:
    # The timestamp commit is created only after a real site change has passed
    # validation. This avoids notifying for the earlier, intermediate Pages build.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_commit.message != null &&
      contains(github.event.workflow_run.head_commit.message, 'Update site timestamp')
    runs-on: ubuntu-latest
    steps:
      - name: Notify the site owner in GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const title = "Site deployment notifications";

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            let issue = openIssues.find(item =>
              !item.pull_request && item.title === title
            );

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: "This thread records successful GitHub Pages deployments. Each successful site update will add a comment and mention @cedarparkjacob."
              });
              issue = created.data;
            }

            const shortSha = (run.head_sha || "").slice(0, 7);
            const deployedAt = new Date(run.updated_at || run.created_at).toUTCString();
            const body = [
              "@cedarparkjacob **Your site update is live.**",
              "",
              "- Site: https://ludden.uk/",
              "- Photo gallery: https://ludden.uk/travel/photos.html",
              "- Published commit: `" + shortSha + "`",
              "- Deployment completed: " + deployedAt,
              "- [View successful Pages deployment](" + run.html_url + ")"
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body
            });
