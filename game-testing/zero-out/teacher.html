      currentValue:
        firstValue,

      lastValue: null,

      lastTeamId: null,

      teams,

      timerSeconds: null,

      timerRunning: false

    };


    await set(
      gameRef,
      initialGame
    );


    /*
      Verify that Firebase actually
      contains the game.
    */

    const check =
      await get(gameRef);


    console.log(
      "CREATED GAME:",
      check.val()
    );


    /*
      Start listening.
    */

    listenToGame();


    /*
      Show the game.
    */

    gameCodeElement.textContent =
      gameId;


    setupSection.classList.add(
      "hidden"
    );

    gameSection.classList.remove(
      "hidden"
    );


    statusElement.textContent =
      "Game created. Give this code to your students.";


  }

  catch (error) {

    console.error(
      "Failed to create game:",
      error
    );


    statusElement.textContent =
      "Could not create the game.";


    createGameButton.disabled =
      false;

  }

}


/* =========================================================
   GAME CODE
   ========================================================= */

function generateGameCode() {

  const characters =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let code = "";


  for (let i = 0; i < 6; i++) {

    code +=
      characters[
        Math.floor(
          Math.random() *
          characters.length
        )
      ];

  }


  return code;

}


/* =========================================================
   FIREBASE LISTENER
   ========================================================= */

function listenToGame() {

  if (!gameRef) {
    return;
  }


  if (unsubscribeGame) {
    unsubscribeGame();
  }


  unsubscribeGame =
    onValue(
      gameRef,
      snapshot => {

        game =
          snapshot.val();


        if (!game) {

          statusElement.textContent =
            "Game not found.";

          return;

        }


        statusElement.textContent =
          "Connected";


        renderGame();

      }
    );

}

function renderGame() {

  renderValue();

  renderTimer();

}


/* =========================================================
   CURRENT VALUE
   ========================================================= */

function renderValue() {

  const element =
    document.getElementById(
      "currentValue"
    );


  if (
    !game ||
    game.currentValue === null ||

  ) {

/* =========================================================
   TEAMS
   ========================================================= */

function renderTeams() {

  const container =
    document.getElementById(
      "teams"
    );


  container.innerHTML = "";


  if (
    !game ||
    !Array.isArray(game.teams)
  ) {

    return;

  }


  game.teams.forEach(
    team => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "team-button";


      button.innerHTML = `

        <div class="team-left">

          <span class="animal">
            ${team.emoji}
          </span>

          <span>
            ${team.name}
          </span>

        </div>

        <div class="score">
          ${formatScore(team.score)}
        </div>

      `;


      if (reassignMode) {

        button.classList.add(
          "reassign-mode"
        );

        if (
          team.id ===
          reassignSelectedTeamId
        ) {

          button.classList.add(
            "reassign-selected"
          );

        }


        button.addEventListener(
          "click",
          () => handleReassignTeam(team.id)
        );

      } else {

        button.addEventListener(
          "click",
          () => awardPoints(team.id)
        );

      }


      container.appendChild(
        button
      );

    }
  );

}


/* =========================================================
   AWARD POINTS
   ========================================================= */

async function awardPoints(teamId) {

  if (
    !game ||
    !game.started ||
    game.currentValue === null ||
    game.currentValue === undefined ||
    !Array.isArray(game.teams)
  ) {

    return;

  }


  const teamIndex =
    game.teams.findIndex(
      team =>
        team.id === teamId
    );


  if (teamIndex === -1) {
    return;
  }


  const value =
    game.currentValue;


  const newScore =
    game.teams[teamIndex].score +
    value;


  const nextValue =
    generatePointValue();


  const updates = {};


  updates[
    "games/" +
    gameId +
    "/teams/" +
    teamIndex +
    "/score"
  ] =
    newScore;


  updates[
    "games/" +
    gameId +
    "/lastValue"
  ] =
    value;


  updates[
    "games/" +
    gameId +
    "/lastTeamId"
  ] =
    teamId;


  updates[
    "games/" +
    gameId +
    "/currentValue"
  ] =
    nextValue;


  await update(
    ref(db),
    updates
  );

}

/* =========================================================

document

async function reassignLastValue() {

  if (
    !game ||
    !Array.isArray(game.teams) ||
    game.lastValue === null ||
    game.lastValue === undefined ||
    !game.lastTeamId
  ) {

    return;

  }


  const oldIndex =
    game.teams.findIndex(
      team =>
        team.id === game.lastTeamId
    );


  if (oldIndex === -1) {
    return;
  }


  reassignMode = true;
  reassignSelectedTeamId = null;


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });


  const reassignButton =
    document.getElementById(
      "reassign"
    );


  if (reassignButton) {

    reassignButton.textContent =
      "CANCEL?";


  }


  renderTeams();

}

function restoreReassignButton() {

  const reassignButton =
    document.getElementById(
      "reassign"
    );


  if (!reassignButton) {
    return;
  }


  reassignButton.textContent =
    "REASSIGN LAST VALUE";


}


function cancelReassign() {

  reassignMode = false;
  reassignSelectedTeamId = null;

  restoreReassignButton();
  renderTeams();

}
  
  async function handleReassignTeam(
  newTeamId
) {

  if (
    !reassignMode ||
    !game ||
    !gameRef
  ) {

    return;

  }


  const oldTeamId =
    game.lastTeamId;


  const value =
    game.lastValue;


  if (
    oldTeamId === null ||
    oldTeamId === undefined ||
    value === null ||
    value === undefined
  ) {

    cancelReassign();
    return;

  }


  // Selecting the team that already has
  // the value being reassigned does nothing.
  if (
    newTeamId === oldTeamId
  ) {

    reassignMode = false;
    reassignSelectedTeamId = null;

    restoreReassignButton();
    renderTeams();

    return;

  }


  const oldIndex =
    game.teams.findIndex(
      team =>
        team.id === oldTeamId
    );


  const newIndex =
    game.teams.findIndex(
      team =>
        team.id === newTeamId
    );


  if (
    oldIndex === -1 ||
    newIndex === -1
  ) {

    cancelReassign();
    return;

  }


  // Remember which team was selected
  // so it stays red.
  reassignSelectedTeamId =
    newTeamId;


  renderTeams();


  const updates = {};


  updates[
    "games/" +
    gameId +
    "/teams/" +
    oldIndex +
    "/score"
  ] =
    game.teams[oldIndex].score -
    value;


  updates[
    "games/" +
    gameId +
    "/teams/" +
    newIndex +
    "/score"
  ] =
    game.teams[newIndex].score +
    value;


  updates[
    "games/" +
    gameId +
    "/lastTeamId"
  ] =
    newTeamId;


  try {

    await update(
      ref(db),
      updates
    );


    // Leave the selected team red
    // for half a second.
    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          500
        )
    );


  } catch (error) {

    console.error(
      "Error reassigning value:",
      error
    );

  }


  reassignMode = false;
  reassignSelectedTeamId = null;

  restoreReassignButton();
  renderTeams();

}

/* =========================================================
   RANDOM VALUE
   ========================================================= */

function generatePointValue() {

  let value = 0;


  while (value === 0) {

    value =
      Math.floor(
        Math.random() * 201
      ) - 100;

  }


  return value;

}

function renderTimer() {

/* =========================================================

document
  .getElementById("setTimer")
  .addEventListener(
    "click",
    startTimer
  );


async function startTimer() {

  if (!game || !game.started) {
    return;
  }


  const minutes =
    Number(
      document.getElementById(
        "timerMinutes"
      ).value
    ) || 0;


  const seconds =
    Number(
      document.getElementById(
        "timerSeconds"
      ).value
    ) || 0;


  const total =
    minutes * 60 +
    seconds;


  if (total <= 0) {
    return;
  }


  await update(
    gameRef,
    {

      timerSeconds:
        total,

      timerRunning:
        true

    }
  );


  startLocalTimer();

}


/* =========================================================
   LOCAL TIMER
   ========================================================= */

function startLocalTimer() {

  if (timerInterval !== null) {

    clearInterval(
      timerInterval
    );

  }

  timerInterval =
    setInterval(
      async () => {

        if (!game) {
          return;
        }

        /*
        Check for zero FIRST.
        */

        if (
          game.timerSeconds !== null &&
          game.timerSeconds !== undefined &&
          game.timerSeconds <= 0
        ) {

          clearInterval(
            timerInterval
          );

          timerInterval = null;

          await finishGame();

          return;
        }

        /*
        Nothing to do if the timer isn't running.
        */

        if (
          game.timerSeconds === null ||
          game.timerSeconds === undefined ||
          !game.timerRunning
        ) {

          return;

        }

        const next =
          game.timerSeconds - 1;

        await update(
          gameRef,
          {

            timerSeconds:
              next,

            timerRunning:
              next > 0

          }
        );

      },
      1000
    );
}

async function finishGame() {

  if (!game) {
    return;
  }

  if (
    timerInterval !== null
  ) {

    clearInterval(
      timerInterval
    );

    timerInterval = null;

  }

  await update(

      started: false,

      timerSeconds: null,

      timerRunning: false
    }
  );

  showWinner();

}


  /* =========================================================
   WINNER
   ========================================================= */

function determineWinners() {

  if (
    !game ||
    !Array.isArray(game.teams) ||
    game.teams.length === 0
  ) {
    return [];
  }

  const winningScore =
    Math.min(
      ...game.teams.map(
        team => Math.abs(team.score)
      )
    );

  return game.teams.filter(
    team =>
      Math.abs(team.score) === winningScore
  );

}


function showWinner() {

  const winners =
    determineWinners();

  if (winners.length === 0) {
    return;
  }

  document.getElementById(
    "winnerAnimal"
  ).textContent =
    winners
      .map(winner => winner.emoji)
      .join(" ");

  document.getElementById(
    "winnerName"
  ).textContent =
    winners
      .map(winner => winner.name)
      .join(" & ");

  document.getElementById(
    "winnerScore"
  ).textContent =
    formatScore(
      winners[0].score
    );

  document.getElementById(
    "winnerScreen"
  ).classList.remove(
    "hidden"
  );

}

async function startNewRound() {

if (

  )

  return;
}
  
  if (

    !gameRef ||

  ) {

  // Cancel any open reassign mode.

  restoreReassignButton();

  // Keep the same teams, but reset their scores.
  const teams = game.teams.map(team => ({
    ...team,
    score: 0
  }));

const newValue = generatePointValue();
  
  try {

    await update(
      gameRef,
      {
        teams: teams,
        currentValue: newValue,
        lastValue: null,
        lastTeamId: null,
        timerSeconds: null,
        timerRunning: false,
        started: true
      }
    );

  } catch (error) {

    console.error(
      "Error starting new round:",
      error
    );

  }

}

/* =========================================================
   FORMATTING
   ========================================================= */

function formatScore(value) {

  if (value > 0) {

    return "+" + value;

  }

  return String(value);

}


function formatTime(totalSeconds) {

  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  return (
    String(minutes).padStart(2, "0") +
    ":" +
    String(seconds).padStart(2, "0")
  );

}
