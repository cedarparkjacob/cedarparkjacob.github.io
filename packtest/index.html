<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packtest — Crack Packs</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2c;--line:#293750;--text:#edf3ff;--muted:#9aaac2;--accent:#8d7bff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#26365b 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{max-width:1400px;margin:auto;padding:28px 24px 18px;display:flex;align-items:end;justify-content:space-between;gap:20px}
h1{font-size:clamp(28px,4vw,42px);line-height:1.05;margin:0 0 8px;letter-spacing:-.04em}
header p{margin:0;color:var(--muted)}
header a{color:#c8c0ff;text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:10px;white-space:nowrap}
main{max-width:1400px;margin:auto;padding:12px 24px 50px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.demo{min-width:0;background:linear-gradient(160deg,#17233a,#101827 65%);border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 32px #0003}
.demo h2{font-size:15px;margin:0;align-self:flex-start}
.demo .desc{font-size:12px;color:var(--muted);min-height:34px;margin:4px 0 8px;align-self:flex-start}
.stage{position:relative;width:min(100%,190px);aspect-ratio: .64;display:grid;place-items:center;margin:0 auto 12px;perspective:800px;isolation:isolate}
.pack,.top-piece{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pack{z-index:1}
.top-piece{z-index:3;clip-path:inset(0 0 90% 0);transform-origin:50% 100%}
.seam{position:absolute;z-index:4;left:10%;right:10%;top:10%;border-top:2px dashed #f5e9bd;filter:drop-shadow(0 1px 2px #000);opacity:.9}
.stage:after{content:"";position:absolute;z-index:2;left:7%;right:7%;top:10%;height:3px;background:linear-gradient(90deg,transparent,#ffefbd,transparent);opacity:0}
.crack{width:100%;border:0;border-radius:10px;background:linear-gradient(135deg,#9a8cff,#6752df);color:white;font-weight:750;padding:11px 12px;font-size:14px;cursor:pointer;box-shadow:0 5px 14px #0004}
.crack:hover{filter:brightness(1.12);transform:translateY(-1px)}
.crack:active{transform:translateY(0)}
.crack:focus-visible{outline:3px solid white;outline-offset:3px}
.demo small{color:var(--muted);font-size:11px;margin-top:8px}
.stage.go .pack{animation:base-reveal .9s ease-out both}
@keyframes base-reveal{to{clip-path:inset(10% 0 0 0)}}

/* Ten crumple variations. Every torn strip travels upward. */
.top-piece{transform-origin:50% 0%;clip-path:inset(0 0 90% 0)}
/* Draw the perforation first. At the exact start of the crumple, remove
   the matching strip from the base image so it can never appear twice. */
.seam{left:10%;right:10%;width:80%;height:4px;display:flex;align-items:center;justify-content:space-between;border:0;transform:none;opacity:1;filter:drop-shadow(0 1px 2px #000)}
.seam .bulb{display:block;width:3px;height:3px;flex:0 0 3px;border-radius:50%;background:#fff1c6;opacity:.12;box-shadow:0 0 1px #fff1c6}
.stage.go .seam .bulb{animation:bulb-ripple calc(320ms / var(--speed)) ease-out both}
@keyframes bulb-ripple{0%{opacity:.12;filter:brightness(1)}24%{opacity:1;filter:brightness(2.4);box-shadow:0 0 5px 2px #fff1c6}58%{opacity:.28;filter:brightness(1.2);box-shadow:0 0 1px #fff1c6}100%{opacity:.08;filter:brightness(1);box-shadow:none}}
.stage.go .pack{animation:hide-torn-strip .01s step-end calc(1.3s / var(--speed)) forwards}
@keyframes hide-torn-strip{to{clip-path:inset(10% 0 0 0)}}
.stage.go .top-piece{will-change:transform,opacity,filter}

.stage.go .top-piece{animation:crumple1 calc(.95s / var(--speed)) ease-in calc(1.3s / var(--speed)) both}
@keyframes crumple1{0%{transform:translateY(0) scale(1);opacity:1}35%{transform:translateY(-4%) scale(.94) rotate(4deg);filter:brightness(1.3)}100%{transform:translateY(-165%) scale(.12) rotate(35deg);filter:blur(8px);opacity:0}}
@keyframes crumple2{0%{transform:translateY(0)}25%{transform:translateY(-3%) scaleX(.72) scaleY(.9) rotate(-8deg)}55%{transform:translateY(-18%) scale(.5,.7) rotate(12deg)}100%{transform:translateY(-150%) scale(.08) rotate(-28deg);filter:blur(6px);opacity:0}}
@keyframes crumple3{0%{transform:translateY(0)}20%{transform:translateY(-2%) scale(.9) rotate(10deg)}42%{transform:translateY(-12%) scale(.55,.38) rotate(-12deg)}68%{transform:translateY(-30%) scale(.35,.5) rotate(18deg)}100%{transform:translateY(-145%) scale(.06) rotate(48deg);filter:blur(9px);opacity:0}}
@keyframes crumple4{0%{transform:translateY(0)}30%{transform:translateY(-8%) scale(.85,.55) skewX(12deg) rotate(-6deg)}60%{transform:translateY(-24%) scale(.4,.3) skewX(-18deg) rotate(14deg)}100%{transform:translateY(-175%) scale(.1,.18) rotate(-35deg);filter:blur(7px);opacity:0}}
@keyframes crumple5{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-10%) scale(.94) rotate(4deg);filter:brightness(1.4)}100%{transform:translateY(-185%) scale(.12) rotate(35deg);filter:blur(8px);opacity:0}}
@keyframes crumple6{0%{transform:translateY(0)}18%{transform:translateY(-5%) rotate(-13deg) scale(.8)}38%{transform:translateY(-15%) rotate(15deg) scale(.6,.4)}58%{transform:translateY(-27%) rotate(-18deg) scale(.35,.25)}100%{transform:translateY(-160%) rotate(28deg) scale(.04);filter:blur(5px);opacity:0}}
@keyframes crumple7{0%{transform:translateY(0)}25%{transform:translateY(-6%) scaleX(.35) scaleY(.9) rotate(2deg)}50%{transform:translateY(-20%) scaleX(.7) scaleY(.3) rotate(-10deg)}75%{transform:translateY(-45%) scale(.25) rotate(8deg)}100%{transform:translateY(-170%) scale(.03) rotate(-18deg);filter:blur(8px);opacity:0}}
@keyframes crumple8{0%{transform:translateY(0)}12%{transform:translateY(-3%) rotate(8deg)}24%{transform:translateY(-8%) rotate(-9deg) scale(.75)}36%{transform:translateY(-14%) rotate(11deg) scale(.52,.7)}48%{transform:translateY(-22%) rotate(-12deg) scale(.35,.42)}100%{transform:translateY(-155%) rotate(55deg) scale(.06);filter:blur(10px);opacity:0}}
@keyframes crumple9{0%{transform:translateY(0)}30%{transform:translateY(-7%) scale(.9) rotate(-5deg);filter:brightness(1.7) saturate(1.5)}65%{transform:translateY(-30%) scale(.28,.55) rotate(20deg);filter:brightness(1.3)}100%{transform:translateY(-190%) scale(.02) rotate(75deg);filter:blur(12px);opacity:0}}
@keyframes crumple10{0%{transform:translateY(0)}20%{transform:translateY(-5%) scale(.9,.75) rotate(14deg)}40%{transform:translateY(-16%) scale(.65,.35) rotate(-18deg)}60%{transform:translateY(-32%) scale(.38,.2) rotate(24deg)}80%{transform:translateY(-65%) scale(.18,.12) rotate(-12deg)}100%{transform:translateY(-180%) scale(.025) rotate(40deg);filter:blur(9px);opacity:0}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){header{padding:22px 16px 14px;align-items:start}main{padding:10px 12px 32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.demo{padding:10px}.stage{width:min(100%,155px)}.demo .desc{min-height:48px}}
</style>
</head>
<body>
<header>
  <div><h1>Packtest</h1><p>Ten ways to tear into a Base Set booster. Crack each one to compare.</p></div>
  <a href="/crackpacks/">← Crack Packs</a>
</header>
<main><section class="grid" id="demos" aria-label="Pack opening animation tests"></section></main>
<script>
(() => {
  const art = "https://archives.bulbagarden.net/media/upload/4/4c/Base_Set_Booster_Charizard_Unlimited.jpg";
  const demos = Array.from({length:10},(_,i)=>{const speed=1+i*.1;return [`${speed.toFixed(1)}× speed`,`${Math.round(i*10)}% faster than the original ripple.`]});
  const root = document.getElementById("demos");
  demos.forEach(([name,desc],i) => {
    const n=i+1;
    const card=document.createElement("article");
    card.className="demo";
    card.innerHTML='<h2>'+String(n).padStart(2,"0")+' · '+name+'</h2><p class="desc">'+desc+'</p><div class="stage" data-style="'+n+'"><img class="pack" src="'+art+'" alt="Base Set Charizard booster pack"><img class="top-piece" src="'+art+'" alt=""><div class="seam" aria-hidden="true"></div></div><button class="crack" type="button">Crack pack</button><small>Animation '+n+' / 10</small>';
    const stage=card.querySelector(".stage");
    const speed=1+(n-1)*0.1;
    stage.style.setProperty("--speed",speed.toFixed(1));
    const seam=card.querySelector(".seam");
    for(let j=0;j<27;j++){
      const bulb=document.createElement("span");
      bulb.className="bulb";
      bulb.style.animationDelay=(j*42/speed)+"ms";
      seam.appendChild(bulb);
    }
    const button=card.querySelector("button");
    button.addEventListener("click",()=>{
      if(stage.classList.contains("go")) return;
      stage.classList.add("go");
      button.disabled=true;
      button.textContent="Cracked!";
      window.setTimeout(()=>{
        stage.classList.remove("go");
        button.disabled=false;
        button.textContent="Crack again";
      },2650/speed);
    });
    root.appendChild(card);
  });
})();
</script>
</body>
</html>
