<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Packtest — Crack Packs</title>
<style>
:root{color-scheme:dark;--bg:#080d19;--panel:#111a2c;--line:#293750;--text:#edf3ff;--muted:#9aaac2;--accent:#8d7bff}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -15%,#26365b 0,transparent 55%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{max-width:1400px;margin:auto;padding:28px 24px 18px;display:flex;align-items:end;justify-content:space-between;gap:20px}
h1{font-size:clamp(28px,4vw,42px);line-height:1.05;margin:0 0 8px;letter-spacing:-.04em}
header p{margin:0;color:var(--muted)}
header a{color:#c8c0ff;text-decoration:none;border:1px solid var(--line);padding:9px 13px;border-radius:10px;white-space:nowrap}
main{max-width:1400px;margin:auto;padding:12px 24px 50px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.demo{min-width:0;background:linear-gradient(160deg,#17233a,#101827 65%);border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;flex-direction:column;align-items:center;box-shadow:0 12px 32px #0003}
.demo h2{font-size:15px;margin:0;align-self:flex-start}
.demo .desc{font-size:12px;color:var(--muted);min-height:34px;margin:4px 0 8px;align-self:flex-start}
.stage{position:relative;width:min(100%,190px);aspect-ratio: .64;display:grid;place-items:center;margin:0 auto 12px;perspective:800px;isolation:isolate}
.pack,.top-piece{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;pointer-events:none}
.pack{z-index:1}
.top-piece{z-index:3;clip-path:inset(0 0 90% 0);transform-origin:50% 100%}
.seam{position:absolute;z-index:4;left:10%;right:10%;top:10%;border-top:2px dashed #f5e9bd;filter:drop-shadow(0 1px 2px #000);opacity:.9}
.stage:after{content:"";position:absolute;z-index:2;left:7%;right:7%;top:10%;height:3px;background:linear-gradient(90deg,transparent,#ffefbd,transparent);opacity:0}
.crack{width:100%;border:0;border-radius:10px;background:linear-gradient(135deg,#9a8cff,#6752df);color:white;font-weight:750;padding:11px 12px;font-size:14px;cursor:pointer;box-shadow:0 5px 14px #0004}
.crack:hover{filter:brightness(1.12);transform:translateY(-1px)}
.crack:active{transform:translateY(0)}
.crack:focus-visible{outline:3px solid white;outline-offset:3px}
.demo small{color:var(--muted);font-size:11px;margin-top:8px}
.stage.go .pack{animation:base-reveal .9s ease-out both}
@keyframes base-reveal{to{clip-path:inset(10% 0 0 0)}}

/* 1 — straight peel */
.stage.go[data-style="1"] .top-piece{animation:peel .9s cubic-bezier(.2,.75,.25,1) both}
@keyframes peel{35%{transform:rotateX(28deg) translateY(-8%)}to{transform:rotateX(75deg) translateY(-95%) scale(.9);opacity:0}}
/* 2 — sharp diagonal tear */
.stage.go[data-style="2"] .top-piece{clip-path:polygon(0 0,100% 0,100% 100%,0 72%);animation:diagonal .85s ease-in both}
@keyframes diagonal{to{transform:translate(24%,-115%) rotate(18deg);opacity:0}}
/* 3 — yank straight upward */
.stage.go[data-style="3"] .top-piece{animation:yank .58s cubic-bezier(.1,.8,.2,1) both}
@keyframes yank{12%{transform:translateY(2%) rotate(-2deg)}to{transform:translateY(-145%) rotate(7deg);opacity:0}}
/* 4 — two-corner rip */
.stage.go[data-style="4"] .top-piece{clip-path:polygon(0 0,100% 0,100% 100%,75% 78%,50% 100%,25% 78%,0 100%);animation:corners .9s ease-in both}
@keyframes corners{to{transform:translateY(-105%) rotate(-9deg) skewX(-8deg);opacity:0}}
/* 5 — crumple and vanish */
.stage.go[data-style="5"] .top-piece{animation:crumple .95s ease-in both}
@keyframes crumple{35%{filter:brightness(1.4);transform:scale(.94) rotate(4deg)}to{transform:translateY(-50%) scale(.12) rotate(35deg);filter:blur(8px);opacity:0}}
/* 6 — fizzing dissolve */
.stage.go[data-style="6"] .top-piece{animation:fizz .9s steps(7,end) both}
@keyframes fizz{to{clip-path:polygon(0 0,100% 0,91% 24%,100% 43%,77% 54%,88% 77%,56% 70%,43% 100%,22% 73%,0 88%);transform:translateY(-75%) rotate(12deg);filter:blur(5px);opacity:0}}
.stage.go[data-style="6"]:after{animation:spark .65s ease-out both}
@keyframes spark{15%{opacity:1;transform:scaleX(1.1)}to{opacity:0;transform:scaleX(1.8)}}
/* 7 — roll the wrapper edge */
.stage.go[data-style="7"] .top-piece{transform-origin:50% 100%;animation:roll .9s ease-in-out both}
@keyframes roll{45%{transform:rotateX(-45deg) translateY(-8%)}to{transform:rotateX(-115deg) translateY(-100%);opacity:0}}
/* 8 — violent snap */
.stage.go[data-style="8"] .top-piece{animation:snap .65s cubic-bezier(.15,.85,.25,1) both}
@keyframes snap{10%{transform:translateX(-3%) rotate(-3deg)}25%{transform:translateX(3%) rotate(3deg)}to{transform:translate(12%,-130%) rotate(22deg);opacity:0}}
/* 9 — burn-away edge */
.stage.go[data-style="9"] .top-piece{animation:burn .95s ease-in both}
@keyframes burn{40%{filter:brightness(1.9) sepia(1);clip-path:inset(0 0 35% 0)}to{clip-path:inset(0 0 100% 0);filter:brightness(2) blur(7px);transform:translateY(-35%);opacity:0}}
/* 10 — zipper peel, alternating folds */
.stage.go[data-style="10"] .top-piece{animation:zip .95s ease-in both}
@keyframes zip{20%{clip-path:polygon(0 0,100% 0,100% 55%,0 45%)}55%{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);transform:skewY(9deg)}to{transform:translateY(-120%) rotate(-12deg);opacity:0}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:820px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){header{padding:22px 16px 14px;align-items:start}main{padding:10px 12px 32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.demo{padding:10px}.stage{width:min(100%,155px)}.demo .desc{min-height:48px}}
</style>
</head>
<body>
<header>
  <div><h1>Packtest</h1><p>Ten ways to tear into a Base Set booster. Crack each one to compare.</p></div>
  <a href="/crackpacks/">← Crack Packs</a>
</header>
<main><section class="grid" id="demos" aria-label="Pack opening animation tests"></section></main>
<script>
(() => {
  const art = "https://archives.bulbagarden.net/media/upload/4/4c/Base_Set_Booster_Charizard_Unlimited.jpg";
  const demos = [
    ["Clean peel","The top folds back, then lifts away."],
    ["Diagonal rip","A jagged corner tears off at an angle."],
    ["Quick yank","The sealed strip snaps straight upward."],
    ["Double-corner tear","Two torn corners pull the top free."],
    ["Crumple","The wrapper top compresses and disappears."],
    ["Fizzle","The torn edge breaks apart and fades."],
    ["Rolled edge","The top bends backward like peeled foil."],
    ["Hard snap","A quick tug with a sharp sideways flick."],
    ["Burn-away","The cut edge glows, chars, and dissolves."],
    ["Zipper tear","The tear travels across before peeling away."]
  ];
  const root = document.getElementById("demos");
  demos.forEach(([name,desc],i) => {
    const n=i+1;
    const card=document.createElement("article");
    card.className="demo";
    card.innerHTML='<h2>'+String(n).padStart(2,"0")+' · '+name+'</h2><p class="desc">'+desc+'</p><div class="stage" data-style="'+n+'"><img class="pack" src="'+art+'" alt="Base Set Charizard booster pack"><img class="top-piece" src="'+art+'" alt=""><div class="seam"></div></div><button class="crack" type="button">Crack pack</button><small>Animation '+n+' / 10</small>';
    const stage=card.querySelector(".stage");
    const button=card.querySelector("button");
    button.addEventListener("click",()=>{
      if(stage.classList.contains("go")) return;
      stage.classList.add("go");
      button.disabled=true;
      button.textContent="Cracked!";
      window.setTimeout(()=>{
        stage.classList.remove("go");
        button.disabled=false;
        button.textContent="Crack again";
      },1150);
    });
    root.appendChild(card);
  });
})();
</script>
</body>
</html>
